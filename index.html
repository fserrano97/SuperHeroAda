<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="icon" type="image/png" href="/images/hero.png" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <title>Buscador de Superhéroes</title>
  </head>
  <body>
    <!-- Titulo principal -->
    <header>
      <div
        class="hero-left is-flex-direction-column is-align-items-center"
      >
        <div class="content-title ">
          <h1 class="title-header-1 has-text-white has-text-weight-bold">
            BUSCADOR DE
          </h1>
          <h2 class="title-header-2 has-text-white">SUPERHEROES</h2>
          <p
            class="subtitle-header has-text-centered has-text-weight-bold"
          >
            BUSCA TU HEROE O VILLANO FAVORITO
          </p>
        </div>
      </div>

      <div class="hero-right">
        <div class="carousel">
  <img class="slide active" src="./heroes/batman.jpg" alt="">
  <img class="slide" src="./heroes/ironman.jpg" alt="">
  <img class="slide" src="./heroes/spider.jpg" alt="">
 <img class="slide" src="./heroes/venom.jpg" alt="">
</div>
      </div>

      
    </header>

    <section>
<div class="ticker ">
  <div class="ticker-content">
    <span>MARVEL</span>
    <span>DC COMICS</span>
    <span>DARK HORSE</span>
    <span>ORACLE</span>
    <span>TEMPEST</span>
     <span>TOXIC</span>
      <span>SPOILER</span>
      <span>SYFY</span>
      <SPAN>GIANT-MAN</span>

         <span>MARVEL</span>
    <span>DC COMICS</span>
    <span>DARK HORSE</span>
    <span>ORACLE</span>
    <span>TEMPEST</span>
     <span>TOXIC</span>
      <span>SPOILER</span>
      <span>SYFY</span>
      <SPAN>GIANT-MAN</span>

      
  </div>
</div> 
    </section>
    
    <!--Buscador y Filtros-->
    <main>
      <div class="container-filters-cards is-flex" >

      
      <section class="section fondo-filtros is-flex">
        <div class="container ">
          <div>
            <!-- Buscador -->
            <div class="column is-12-mobile">
              <div class="field">
                <div class="control has-icons-left">
                  <input
                    class="input"
                    type="text"
                    placeholder="Buscar..."
                    id="buscador"
                  />
                  <span class="icon is-small is-left"> 🔍 </span>
                </div>
              </div>
            </div>

            <!-- Villanos o heroes -->
            <div class="column is-12-mobile">
              <div class="select is-fullwidth">
                <select id="tipo">
                  <option value="todos">Todos los tipos</option>
                  <option value="bad">Villanos</option>
                  <option value="good">Heroes</option>
                  <option value="neutral">Neutral</option>
                </select>
              </div>
            </div>

            <!-- Editorial -->
            <div class="column is-12-mobile">
              <div class="select is-fullwidth">
                <select id="editorial">
                  <option value="todos">Todos las editoriales</option>
                  <option value="marvel">Marvel</option>
                  <option value="dc">DC Comics</option>
                  <option value="dark">Dark Horse</option>
                </select>
              </div>
            </div>

            <!-- Orden alfabético -->
            <div class="column is-12-mobile">
              <div class="select is-fullwidth">
                <select id="orden">
                  <option value="az">A → Z</option>
                  <option value="za">Z → A</option>
                </select>
              </div>
            </div>

            <!-- Limpiar -->
            <div class="column is-12-mobile">
              <button id="limpiar" class="button is-fullwidth">
                Limpiar filtros
              </button>
            </div>
          </div>
        </div>
      </section>

      <!--Contenedor de heroes-->
      <section class="container">
        <div
          id="loading"
          class="is-justify-content-center is-align-items-center"
        >
          <button class="button is-loading is-large is-danger">Cargando</button>
        </div>

        <!--Heroes...-->
        <div id="heroes-grid" class="grid">
          <!--Aca va la grilla de heroes, se llena con JS-->
        </div>
      </section>

      <!-- Modal -->
      <div id="hero-modal" class="modal">
        <div class="modal-background"></div>

        <div class="modal-content">
          <div class="box" id="modal-content">
            <!-- contenido dinámico -->
          </div>
        </div>
        <button class="modal-close is-large" aria-label="close"></button>
      </div>

      </div>


      <!--Paginación-->
      <section class="section">
        <div class="content-pag has-text-centered">
          <button id="first" class="button is-dark mr-2">⏮</button>
          <button id="prev" class="button is-dark mr-2">◀</button>

          <span id="pagina-info"></span>

          <button id="next" class="button is-dark ml-2">▶</button>
          <button id="last" class="button is-dark ml-2">⏭</button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer-text  has-text-centered letter-spacing-15">
        2026 Buscador de SuperHeroes. Creditos a Florencia Serrano.
      </p>
    </footer>
  </body>
  <script type="module" src="/src/js/main.js"></script>
</html>
